name: Publish NuGet Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_all:
        description: Publish all packages (ignore change detection)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: filter
        env:
          PUBLISH_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_all == 'true' }}
        run: |
          set -euo pipefail

          declare -A PACKAGES=(
            ["TheNerdCollective.Services"]="src/TheNerdCollective.Services"
            ["TheNerdCollective.Services.BlazorServer"]="src/TheNerdCollective.Services.BlazorServer"
            ["TheNerdCollective.Components"]="src/TheNerdCollective.Components"
            ["TheNerdCollective.Components.BlazorServerCircuitHandler"]="src/TheNerdCollective.Components.BlazorServerCircuitHandler"
            ["TheNerdCollective.Blazor.Reconnect"]="src/TheNerdCollective.Blazor.Reconnect"
            ["TheNerdCollective.Blazor.VersionMonitor"]="src/TheNerdCollective.Blazor.VersionMonitor"
            ["TheNerdCollective.Blazor.SessionMonitor"]="src/TheNerdCollective.Blazor.SessionMonitor"
            ["TheNerdCollective.Blazor.ThemeKit"]="src/TheNerdCollective.Blazor.ThemeKit"
            ["TheNerdCollective.Blazor.Observability"]="src/TheNerdCollective.Blazor.Observability"
            ["TheNerdCollective.Blazor.Observability.SigNoz"]="src/TheNerdCollective.Blazor.Observability.SigNoz"
            ["TheNerdCollective.Helpers"]="src/TheNerdCollective.Helpers"
            ["TheNerdCollective.Integrations.Harvest"]="src/TheNerdCollective.Integrations.Harvest"
            ["TheNerdCollective.Integrations.GitHub"]="src/TheNerdCollective.Integrations.GitHub"
            ["TheNerdCollective.Integrations.AzurePipelines"]="src/TheNerdCollective.Integrations.AzurePipelines"
            ["TheNerdCollective.Cli.Trello"]="src/TheNerdCollective.Cli.Trello"
            ["TheNerdCollective.Integrations.Dar"]="src/TheNerdCollective.Integrations.Dar"
            ["TheNerdCollective.MudComponents.MudQuillEditor"]="src/TheNerdCollective.MudComponents.MudQuillEditor"
            ["TheNerdCollective.MudComponents.MudSwiper"]="src/TheNerdCollective.MudComponents.MudSwiper"
            ["TheNerdCollective.MudComponents.HarvestTimesheet"]="src/TheNerdCollective.MudComponents.HarvestTimesheet"
            ["TheNerdCollective.MudComponents.SessionMonitor"]="src/TheNerdCollective.MudComponents.SessionMonitor"
            ["TheNerdCollective.MudComponents.ThemeKit"]="src/TheNerdCollective.MudComponents.ThemeKit"
            ["TheNerdCollective.MudComponents.ObservabilityDashboard"]="src/TheNerdCollective.MudComponents.ObservabilityDashboard"
            ["TheNerdCollective.Blazor.ReCaptcha"]="src/TheNerdCollective.Blazor.ReCaptcha"
            ["TheNerdCollective.Blazor.FeatureFeedback"]="src/TheNerdCollective.Blazor.FeatureFeedback"
            ["TheNerdCollective.MudComponents.FeatureFeedback"]="src/TheNerdCollective.MudComponents.FeatureFeedback"
            ["TheNerdCollective.MudComponents.DesignTokens"]="src/TheNerdCollective.MudComponents.DesignTokens"
            ["TheNerdCollective.MudComponents.DesignTokens.Catalog"]="src/TheNerdCollective.MudComponents.DesignTokens.Catalog"
            ["TheNerdCollective.DesignTokens.Core"]="src/TheNerdCollective.DesignTokens.Core"
            ["TheNerdCollective.MudComponents.ResponsiveTypography"]="src/TheNerdCollective.MudComponents.ResponsiveTypography"
            ["TheNerdCollective.MudComponents.ResponsiveTypography.Catalog"]="src/TheNerdCollective.MudComponents.ResponsiveTypography.Catalog"
            ["TheNerdCollective.MudComponents.Shared"]="src/TheNerdCollective.MudComponents.Shared"
            ["TheNerdCollective.MudComponents.Changelog"]="src/TheNerdCollective.MudComponents.Changelog"
            ["TheNerdCollective.MudComponents.PlayBook"]="src/TheNerdCollective.MudComponents.PlayBook"
            ["TheNerdCollective.Brand.Dnf"]="src/TheNerdCollective.Brand.Dnf"
            ["TheNerdCollective.Brand.Tnc"]="src/TheNerdCollective.Brand.Tnc"
            ["TheNerdCollective.Brand.Acme"]="src/TheNerdCollective.Brand.Acme"
            ["TheNerdCollective.Brand.Demo"]="src/TheNerdCollective.Brand.Demo"
            ["TheNerdCollective.Brand.Dryk"]="src/TheNerdCollective.Brand.Dryk"
          )

          add_package() {
            local pkg_name="$1"
            local pkg_path="$2"
            if [ "$PACKAGES_TO_BUILD" = "[]" ]; then
              PACKAGES_TO_BUILD=$(jq -nc --arg name "$pkg_name" --arg path "$pkg_path" '[{name:$name,path:$path}]')
            elif ! echo "$PACKAGES_TO_BUILD" | jq -e --arg name "$pkg_name" 'any(.name == $name)' >/dev/null; then
              PACKAGES_TO_BUILD=$(echo "$PACKAGES_TO_BUILD" | jq -c --arg name "$pkg_name" --arg path "$pkg_path" '. + [{name:$name,path:$path}]')
            fi
          }

          build_all_packages() {
            PACKAGES_TO_BUILD="[]"
            for pkg_name in "${!PACKAGES[@]}"; do
              add_package "$pkg_name" "${PACKAGES[$pkg_name]}"
            done
          }

          PACKAGES_TO_BUILD="[]"

          if [ "$PUBLISH_ALL" = "true" ]; then
            echo "Manual publish_all requested - building all packages"
            build_all_packages
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            for pkg_name in "${!PACKAGES[@]}"; do
              pkg_path="${PACKAGES[$pkg_name]}"
              if echo "$CHANGED_FILES" | grep -q "^${pkg_path}/"; then
                add_package "$pkg_name" "$pkg_path"
              fi

              for test_dir in "tests/${pkg_name}.Tests" "tests/${pkg_name}.IntegrationTests"; do
                if echo "$CHANGED_FILES" | grep -q "^${test_dir}/"; then
                  add_package "$pkg_name" "$pkg_path"
                fi
              done
            done

            if echo "$CHANGED_FILES" | grep -q "^\.github/workflows/publish-packages.yml"; then
              echo "Publish workflow changed - building all packages"
              build_all_packages
            fi
          fi

          echo "packages=$PACKAGES_TO_BUILD" >> "$GITHUB_OUTPUT"
          echo "Packages to build: $PACKAGES_TO_BUILD"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' ${{ matrix.package.path }}/${{ matrix.package.name }}.csproj | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing ${{ matrix.package.name }} version: $VERSION"

      - name: Restore
        run: dotnet restore ${{ matrix.package.path }}

      - name: Build
        run: dotnet build ${{ matrix.package.path }} -c Release --no-restore

      - name: Pack
        run: dotnet pack ${{ matrix.package.path }} -c Release -o artifacts --no-build

      - name: Configure NuGet Sources
        run: dotnet nuget update source nuget.org -s https://api.nuget.org/v3/index.json --configfile ./NuGet.config 2>/dev/null || dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org --configfile ./NuGet.config

      - name: Push to NuGet
        env:
          NUGET_SECRET: ${{ secrets.NUGET }}
        run: |
          set -euo pipefail
          TOKEN=${NUGET_SECRET:-}
          if [ -z "$TOKEN" ]; then
            echo "No token available (NUGET secret)" >&2
            exit 1
          fi
          for nupkg in artifacts/*.nupkg; do
            case "$nupkg" in
              *.snupkg) continue ;;
            esac
            dotnet nuget push "$nupkg" --source https://api.nuget.org/v3/index.json --api-key "$TOKEN" --skip-duplicate
          done

      - name: Create Git Tag
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG_NAME="${{ matrix.package.name }}-v${{ steps.version.outputs.version }}"
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || true
          git tag -a "$TAG_NAME" -m "${{ matrix.package.name }} ${{ steps.version.outputs.version }}"
          git push origin "$TAG_NAME"
